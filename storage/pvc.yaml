apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data-0
  namespace: dev
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-hostpath
  resources:
    requests:
      storage: 1Gi
  volumeName: mysql-data-pv-0
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data-1
  namespace: dev
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-hostpath
  resources:
    requests:
      storage: 1Gi
  volumeName: mysql-data-pv-1
