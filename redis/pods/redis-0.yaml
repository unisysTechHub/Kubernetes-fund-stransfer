apiVersion: v1
kind: Pod
metadata:
  name: redis-0
  namespace: dev
  labels:
    app: redis
    pod: redis-0
spec:
  hostname: redis-0
  subdomain: redis-headless
  containers:
    - name: redis
      image: redis:6.2
      imagePullPolicy: IfNotPresent
      command: ["redis-server"]
      args: ["--appendonly", "yes", "--bind", "0.0.0.0", "--protected-mode", "no"]
      ports:
        - containerPort: 6379
          name: redis
      volumeMounts:
        - name: redis-data
          mountPath: /data
  volumes:
    - name: redis-data
      persistentVolumeClaim:
        claimName: redis-data-0
