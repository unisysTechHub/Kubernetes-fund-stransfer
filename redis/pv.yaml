apiVersion: v1
kind: PersistentVolume
metadata:
  name: redis-data-pv-0
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-hostpath
  hostPath:
    path: /data/mysql/redis-data-0
    type: DirectoryOrCreate