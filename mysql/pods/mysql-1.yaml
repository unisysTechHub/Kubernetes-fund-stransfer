apiVersion: v1
kind: Pod
metadata:
  name: mysql-1
  namespace: dev
  labels:
    app: mysql
    pod: mysql-1
spec:
  hostname: mysql-1
  subdomain: mysql-headless
  securityContext:
    fsGroup: 999
  containers:
    - name: mysql
      image: mysql:8.0
      imagePullPolicy: IfNotPresent
      env:
        - name: MYSQL_ROOT_PASSWORD
          value: rootpass
        - name: MYSQL_DATABASE
          value: db_example
        - name: MYSQL_USER
          value: springuser
        - name: MYSQL_PASSWORD
          value: ThePassword
      ports:
        - containerPort: 3306
          name: mysql
      volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
  volumes:
    - name: mysql-data
      persistentVolumeClaim:
        claimName: mysql-data-1
