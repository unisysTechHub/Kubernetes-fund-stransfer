apiVersion: v1
kind: ConfigMap
metadata:
  name: userservice-config
  namespace: dev
data:
  SERVER_PORT: "8082"
  SPRING_APPLICATION_NAME: "userservice"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-headless.dev.svc.cluster.local:3306/db_example"
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: "com.mysql.cj.jdbc.Driver"
  SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: "org.hibernate.dialect.MySQL8Dialect"
  SPRING_JPA_SHOW_SQL: "true"
  SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"
  DB_NAME: "db_example"
  DB_USER: "springuser"
  DB_PASS: "ThePassword"
  MYSQL_HOST: "mysql-headless.dev.svc.cluster.local"
  MYSQL_PORT: "3306"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka-headless.dev.svc.cluster.local:9092"
  SPRING_KAFKA_PRODUCER_KEY_SERIALIZER: "org.apache.kafka.common.serialization.StringSerializer"
  SPRING_KAFKA_CONSUMER_GROUP_ID: "group_id"
  SPRING_KAFKA_CONSUMER_KEY_DESERIALIZER: "org.apache.kafka.common.serialization.StringDeserializer"
  COORDINATOR-SERVICE: "coordinatorservice-headless.dev.svc.cluster.local"
  COORDINAOR_SERICE_URL: "http://coordinatorservice-headless.dev.svc.cluster.local:8089"
  JWT_SIGNING_KEY_SECRET: "mySecret"
  JWT_TOKEN_EXPIRATION_IN_SECONDS: "500000"
  JWT_HTTP_REQUEST_HEADER: "Authorization"
  JWT_ALGORITHM: "HS512"
  LOGGING_LEVEL_COM_POC_BANKING_USERSERVICE_SERVICE: "DEBUG"
  LOGGING_LEVEL_ORG_APACHE_KAFKA: "OFF"
