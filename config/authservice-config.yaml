apiVersion: v1
kind: ConfigMap
metadata:
  name: authservice-config
  namespace: dev
data:
  SERVER_PORT: "8090"
  SPRING_APPLICATION_NAME: "AthorizationService"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-0.mysql-headless.dev.svc.cluster.local:3306/db_example"
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: "com.mysql.cj.jdbc.Driver"
  SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: "org.hibernate.dialect.MySQL8Dialect"
  SPRING_JPA_SHOW_SQL: "true"
  SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"
  MYSQL_HOST: "mysql-headless.dev.svc.cluster.local"
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: "db_example"
