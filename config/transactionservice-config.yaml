apiVersion: v1
kind: ConfigMap
metadata:
  name: transactionservice-config
  namespace: dev
data:
  SERVER_PORT: "8086"
  SPRING_APPLICATION_NAME: "transactionservice"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-headless.dev.svc.cluster.local:3306/db_example"
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: "com.mysql.cj.jdbc.Driver"
  SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: "org.hibernate.dialect.MySQL8Dialect"
  SPRING_JPA_SHOW_SQL: "true"
  SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"
  SPRING_DATA_REDIS_HOST: "redis-headless.dev.svc.cluster.local"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_DATABASE: "0"
  SPRING_KAFKA_PRODUCER_KEY_SERIALIZER: "org.apache.kafka.common.serialization.StringSerializer"
  SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER: "org.springframework.kafka.support.serializer.JsonSerializer"
  SPRING_KAFKA_LISTENER_ACK_MODE: "manual"
  SPRING_KAFKA_CONSUMER_ENABLE_AUTO_COMMIT: "true"
  SPRING_KAFKA_LISTENER_TYPE: "single"
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_TRANSACTION: "DEBUG"
  LOGGING_LEVEL_ORG_HIBERNATE_SQL: "DEBUG"
  LOGGING_LEVEL_ORG_HIBERNATE_TYPE_DESCRIPTOR_SQL: "TRACE"
  LOGGING_LEVEL_ORG_APACHE_KAFKA: "OFF"
  MYSQL_HOST: "mysql-headless.dev.svc.cluster.local"
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: "db_example"
