apiVersion: v1
kind: Pod
metadata:
  name: authservice
  namespace: dev
  labels:
    app: authservice
spec:
  imagePullSecrets:
    - name: registry-creds
  containers:
    - name: authservice
      image: unisystechhub/authservice:latest
      imagePullPolicy: IfNotPresent
      envFrom:
        - configMapRef:
            name: authservice-config
        - secretRef:
            name: accountservice-secret
      ports:
        - containerPort: 8090
          name: http
      readinessProbe:
        httpGet:
          path: /actuator/health
          port: 8090
        initialDelaySeconds: 10
        periodSeconds: 10
      livenessProbe:
        httpGet:
          path: /actuator/health
          port: 8090
        initialDelaySeconds: 30
        periodSeconds: 20
