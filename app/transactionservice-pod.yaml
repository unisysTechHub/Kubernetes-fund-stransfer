apiVersion: v1
kind: Pod
metadata:
  name: transactionservice
  namespace: dev
  labels:
    app: transactionservice
spec:
  imagePullSecrets:
    - name: registry-creds
  containers:
    - name: transactionservice
      image: unisystechhub/transactionservice:latest
      imagePullPolicy: IfNotPresent
      envFrom:
        - configMapRef:
            name: transactionservice-config
        - secretRef:
            name: accountservice-secret
      ports:
        - containerPort: 8086
          name: http
      readinessProbe:
        httpGet:
          path: /actuator/health
          port: 8086
        initialDelaySeconds: 10
        periodSeconds: 10
      livenessProbe:
        httpGet:
          path: /actuator/health
          port: 8086
        initialDelaySeconds: 30
        periodSeconds: 20
