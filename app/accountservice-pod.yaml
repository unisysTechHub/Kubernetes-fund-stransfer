apiVersion: v1
kind: Pod
metadata:
  name: accountservice
  namespace: dev
  labels:
    app: accountservice
spec:
  imagePullSecrets:
    - name: registry-creds
  containers:
    - name: accountservice
      image: unisystechhub/accountservice:latest
      imagePullPolicy: IfNotPresent
      envFrom:
        - configMapRef:
            name: accountservice-config
        - secretRef:
            name: accountservice-secret
      ports:
        - containerPort: 8083
          name: http
      readinessProbe:
        httpGet:
          path: /actuator/health
          port: 8083
        initialDelaySeconds: 10
        periodSeconds: 10
      livenessProbe:
        httpGet:
          path: /actuator/health
          port: 8083
        initialDelaySeconds: 30
        periodSeconds: 20
