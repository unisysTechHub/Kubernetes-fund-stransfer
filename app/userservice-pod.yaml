apiVersion: v1
kind: Pod
metadata:
  name: userservice
  namespace: dev
  labels:
    app: userservice
spec:
  imagePullSecrets:
    - name: registry-creds
  containers:
    - name: userservice
      image: unisystechhub/userservice:latest
      imagePullPolicy: IfNotPresent
      envFrom:
        - configMapRef:
            name: userservice-config
      ports:
        - containerPort: 8082
          name: http
      readinessProbe:
        httpGet:
          path: /actuator/health
          port: 8082
        initialDelaySeconds: 10
        periodSeconds: 10
      livenessProbe:
        httpGet:
          path: /actuator/health
          port: 8082
        initialDelaySeconds: 30
        periodSeconds: 20
