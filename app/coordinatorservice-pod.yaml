apiVersion: v1
kind: Pod
metadata:
  name: coordinatorservice
  namespace: dev
  labels:
    app: coordinatorservice
spec:
  imagePullSecrets:
    - name: registry-creds
  containers:
    - name: coordinatorservice
      image: unisystechhub/coordinatorservice:latest
      imagePullPolicy: IfNotPresent
      envFrom:
        - configMapRef:
            name: coordinatorservice-config
      ports:
        - containerPort: 8089
          name: http
      readinessProbe:
        httpGet:
          path: /actuator/health
          port: 8089
        initialDelaySeconds: 10
        periodSeconds: 10
      livenessProbe:
        httpGet:
          path: /actuator/health
          port: 8089
        initialDelaySeconds: 30
        periodSeconds: 20
